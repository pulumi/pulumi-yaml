name: Run Acceptance Tests from PR

on:
  pull_request:

jobs:
  should-test:
    name: Check for code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run-tests: ${{ steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!CHANGELOG.md'
              - '!.changes/**'

  lint:
    needs: should-test
    uses: ./.github/workflows/stage-lint.yml
    with:
      run-tests: ${{ needs.should-test.outputs.run-tests == 'true' }}
  test:
    needs: should-test
    uses: ./.github/workflows/stage-test.yml
    with:
      run-tests: ${{ needs.should-test.outputs.run-tests == 'true' }}
      live-test: true
      coverage: true
    secrets:
      PULUMI_ACCESS_TOKEN:     ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_ACCESS_KEY_ID:       ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:   ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_CI_ROLE_ARN:         ${{ secrets.AWS_CI_ROLE_ARN }}
      ARM_CLIENT_ID:           ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:       ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID:     ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:           ${{ secrets.ARM_TENANT_ID }}
      CODECOV_TOKEN:           ${{ secrets.CODECOV_TOKEN }}
